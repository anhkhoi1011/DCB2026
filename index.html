<!doctype html>
<html lang="vi" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DBC 2026 — Bản Đồ Công Việc &amp; Phối Hợp</title>
    <meta name="description" content="Hệ thống quản lý công việc và quan hệ phối hợp tương tác cho nhóm sinh viên kinh doanh số 2026." />
    <meta property="og:title" content="DBC 2026 — Bản Đồ Công Việc &amp; Phối Hợp" />
    <meta property="og:description" content="Hệ thống quản lý công việc và quan hệ phối hợp tương tác cho nhóm sinh viên kinh doanh số 2026." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('dbc_task_system_v3') || localStorage.getItem('dbc_task_system_v2');
          var theme = 'system';
          if (stored) {
            var parsed = JSON.parse(stored);
            if (parsed && parsed.state && parsed.state.settings && parsed.state.settings.theme) {
              theme = parsed.state.settings.theme;
            }
          }
          var isDark =
            theme === 'dark' ||
            (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.dataset.theme = 'dark';
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.dataset.theme = 'light';
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body class="h-full bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased selection:bg-blue-500/20 selection:text-blue-700">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
